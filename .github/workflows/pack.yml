name: Pack

on:
  push:
    branches:
      - \d+\.x
    tags:
      - \d+\.\d+\.\d+
  workflow_call:
    secrets:
      CREATE_RELEASE_PAT:
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:

  pack:
    runs-on: ubuntu-24.04

    outputs:
      packageVersion: ${{ steps.nbgv.outputs.NuGetPackageVersion }}
      isPreviewRelease: ${{ startsWith(steps.nbgv.outputs.PrereleaseVersionNoLeadingHyphen, 'preview') }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      with:
        fetch-depth: 0
        submodules: 'true'
        token: ${{ secrets.CHECKOUT_TOKEN }}
        
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # 6.0.0
      with:
        global-json-file: global.json
        dotnet-version: |
          9
          8

    - name: Determine semantic version
      uses: dotnet/nbgv@f088059084cb5d872e9d1a994433ca6440c2bf72 # 0.4.2
      id: nbgv

    - name: Replace NuGet version default value in templates
      run: find -name template.json -exec sed -i "s/TEMPLATE_GREMLINQ_VERSION_DEFAULT_VALUE/${{ steps.nbgv.outputs.NuGetPackageVersion }}/g" {} \;

    - name: Build
      run: dotnet build ./${{ github.event.repository.name }}.slnx -c Release -p:ContinuousIntegrationBuild=true

    - name: Pack
      run: dotnet pack ./${{ github.event.repository.name }}.slnx -c Release --no-build

    - name: Copy NuGet packages to artifacts
      uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # 4.4.0
      with:
        name: NuGetPackages
        path: './**/*Gremlinq*.nupkg'
        if-no-files-found: error

    - run: echo ${{ steps.nbgv.outputs.NuGetPackageVersion }} > Version

    - name: Output version to artifacts
      uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # 4.4.0
      with:
        name: Version
        path: Version
        if-no-files-found: error

  attest:
    if: ${{ needs.pack.outputs.isPreviewRelease == 'false' }}
    needs: [ pack ]
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # 4.1.8
      with:
        name: NuGetPackages
        
    - name: Attest build provenance
      if: ${{ github.event.repository.visibility == 'public' }}
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # 2
      with:
        subject-path:  './**/*Gremlinq*.nupkg'
    
  release:
    if: ${{ needs.pack.outputs.isPreviewRelease == 'false' }}
    needs: [ pack, attest ]
    runs-on: ubuntu-24.04

    env:
      VERSION: ${{ needs.pack.outputs.packageVersion }}
      # The workflow grants only 'contents: read', so GITHUB_TOKEN cannot create a release.
      GH_TOKEN: ${{ secrets.CREATE_RELEASE_PAT }}
      GH_REPO: ${{ github.repository }}

    steps:

    # The release notes written by the 'write-release-announcements' skill live in the
    # repository, so this job needs a checkout it previously did not have. It goes into a
    # subdirectory because actions/checkout runs 'git clean -ffdx' in its working
    # directory, which would delete the packages downloaded below.
    - name: Checkout release notes
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      with:
        ref: ${{ github.ref }}
        path: repo
        sparse-checkout: releases
        persist-credentials: false

    - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # 4.1.8
      with:
        name: NuGetPackages
        path: packages

    - name: Look for written release notes
      id: notes
      run: |
        set -euo pipefail
        file="repo/releases/$VERSION/release-notes.md"
        if [ -s "$file" ]; then
          echo "Using releases/$VERSION/release-notes.md as the release body."
          echo "path=$file" >> "$GITHUB_OUTPUT"
        else
          echo "::notice title=No written release notes::releases/$VERSION/release-notes.md is missing, falling back to release-drafter. Run the 'write-release-announcements' skill before tagging to get proper notes."
        fi

    - name: Create draft release from written notes
      if: ${{ steps.notes.outputs.path != '' }}
      env:
        NOTES: ${{ steps.notes.outputs.path }}
      run: |
        set -euo pipefail
        title="${{ github.event.repository.name }} $VERSION"
        if gh release view "$VERSION" >/dev/null 2>&1; then
          # No '--draft' on this path: passing it to 'gh release edit' would turn an
          # already published release back into a draft.
          gh release edit "$VERSION" --title "$title" --notes-file "$NOTES"
        else
          # No '--target': this workflow is triggered by the tag push, so the tag exists.
          gh release create "$VERSION" --draft --title "$title" --notes-file "$NOTES"
        fi

    - name: Create draft release with release-drafter
      if: ${{ steps.notes.outputs.path == '' }}
      uses: release-drafter/release-drafter@b1476f6e6eb133afa41ed8589daba6dc69b4d3f5 # 6.1.0
      with:
        name: ${{ github.event.repository.name }} ${{ needs.pack.outputs.packageVersion }}
        tag: ${{ needs.pack.outputs.packageVersion }}
        commitish: ${{ github.ref }}
        publish: false
      env:
        GITHUB_TOKEN: ${{ secrets.CREATE_RELEASE_PAT }}

    # 'gh release upload' resolves the release by tag, so it works for both paths above and
    # neither of them has to expose an upload URL.
    - name: Upload assets
      run: |
        set -euo pipefail
        # The default shell is 'bash -e {0}', which has globstar off.
        shopt -s globstar nullglob
        files=( packages/**/*Gremlinq*.nupkg )
        if [ "${#files[@]}" -eq 0 ]; then
          echo "::error title=No packages to upload::Found no *Gremlinq*.nupkg below packages/."
          exit 1
        fi
        printf 'Uploading %d asset(s).\n' "${#files[@]}"
        gh release upload "$VERSION" "${files[@]}" --clobber
        

