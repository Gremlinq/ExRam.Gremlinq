name: Cleanup

on:
  registry_package:
    types: [published, updated]
  workflow_call:
    inputs:
      keep-days:
        type: number
        default: 30
        required: false

permissions:
  packages: write   # gh api ... DELETE package versions

jobs:
  cleanup:
    runs-on: ubuntu-slim

    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE_NAME: ${{ github.event.registry_package.name }}
      KEEP_DAYS: ${{ inputs.keep-days || 30 }}

    steps:
    # actions/delete-package-versions only supports keeping a fixed count of
    # versions, not an age cutoff, and is stuck on a Node 20 runtime with no newer
    # release available -- hence the inline script instead of the action.
    - name: Delete preview package versions older than ${{ env.KEEP_DAYS }} days
      run: |
        set -euo pipefail
        cutoff=$(date -u -d "-${KEEP_DAYS} days" +%s)

        # A package that does not give this repository's workflows access is reported as
        # missing, not as forbidden. In Gremlinq.Extensions three packages failed this way on
        # every run while the other thirteen succeeded, so the error says where to look.
        if ! versions="$(gh api --paginate "/orgs/${OWNER}/packages/nuget/${PACKAGE_NAME}/versions" \
            --jq '.[] | [.id, .name, .created_at] | @tsv')"; then
          echo "::error title=Cannot list the versions of ${PACKAGE_NAME}::If GitHub answered 404, the package most likely does not give ${GITHUB_REPOSITORY} access. Open the package's settings on GitHub, and under 'Manage Actions access' add ${GITHUB_REPOSITORY} with the Admin role, which deleting versions needs."
          exit 1
        fi

        printf '%s\n' "$versions" |
        while IFS=$'\t' read -r id name created; do
          [ -n "$id" ] || continue
          [[ "$name" == *-preview* ]] || continue
          created_ts=$(date -u -d "$created" +%s)
          if [ "$created_ts" -lt "$cutoff" ]; then
            echo "Deleting $name ($id), created $created"
            gh api -X DELETE "/orgs/${OWNER}/packages/nuget/${PACKAGE_NAME}/versions/${id}"
          fi
        done
