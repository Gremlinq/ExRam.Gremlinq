name: Check pull request

on:
  pull_request:
  workflow_call:

jobs:

  test:
    if: ${{ github.event.pull_request.head.repo.fork || github.event.pull_request.title != 'Prepare release' }}
    
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2025 ]  
    runs-on: ${{ matrix.os }}   

    steps:
    - name: Checkout
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 #4.1.14
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Setup .NET
      uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # 4.2.0
      with:
        global-json-file: global.json
        dotnet-version: |
          8
   
    - name: Start CosmosDb Emulator
      if: ${{ matrix.os != 'ubuntu-24.04' }}
      uses: janpio/cosmos-emulator-github-action@8c35a1bfde25fc32234c163c044322af3f2e56e3
      with:
          parameter_string: "-Timeout 600 -EnableGremlin"

    - name: Test
      run: dotnet test -c Release --collect:"XPlat Code Coverage;Format=opencover" ./${{ github.event.repository.name }}.slnx

    - name: Test (Debug)
      run: dotnet test -c Debug --collect:"XPlat Code Coverage;Format=opencover" ./${{ github.event.repository.name }}.slnx
      
    - name: Collect coverage
      uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # 5.4.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}