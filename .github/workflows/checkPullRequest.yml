name: Check pull request

on:
  pull_request:
  workflow_call:

jobs:

  test:
    if: ${{ github.event.pull_request.head.repo.fork || github.event.pull_request.title != 'Prepare release' }}
    
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2025 ]  
    runs-on: ${{ matrix.os }}   

    steps:
    - name: Checkout
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 #4.1.14
      with:
        fetch-depth: 0
        submodules: 'true'
        token: ${{ secrets.CHECKOUT_TOKEN }}

    - name: Setup .NET
      uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # 4.2.0
      with:
        global-json-file: global.json
        dotnet-version: |
          9
          8
   
    - name: Start CosmosDb Emulator
      if: ${{ matrix.os != 'ubuntu-24.04' }}
      uses: janpio/cosmos-emulator-github-action@8c35a1bfde25fc32234c163c044322af3f2e56e3
      with:
          parameter_string: "-Timeout 600 -EnableGremlin"

    - name: Test
      run: dotnet test -c Release --solution ./${{ github.event.repository.name }}.slnx --coverlet --coverlet-output-format opencover --ignore-exit-code 8
        --report-trx --report-html --report-gh --crashdump --crash-report-if-supported

    - name: Collect coverage
      uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # 5.5.2
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test reports
      if: ${{ always() }}
      uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # 4.4.0
      with:
        name: TestResults-${{ matrix.os }}
        path: '**/TestResults/**'
        if-no-files-found: warn
        retention-days: 14